[project]
name = "haven-aol"
version = "0.1.0"
description = "Haven-AOL (Always Online): upload-side encryption for conditional token-gated access on DFINITY ICP — DAOs, DataDAOs, agent swarms, and shared web3 resources"
requires-python = ">=3.10"
dependencies = [
    "haven-aol-vetkeys>=0.1.0",
    "cryptography>=50.0.2",
    # Internet Computer principal parsing; install from PyPI only (not the ./icp-py-core reference tree).
    "icp-py-core>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    # Needed by the mainnet attestation probes (eth_account.messages.encode_typed_data).
    "eth-account>=0.14.0",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
