[package]
name = "haven_aol_vetkeys"
version = "0.1.0"
edition = "2021"

[lib]
name = "haven_aol_vetkeys"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
ic-vetkeys = "0.9"
# ic-vetkeys 0.9 uses ic-management-canister-types 0.7.x; the VetKDKeyId
# type must match exactly, so this stays on the latest 0.7 release.
ic-management-canister-types = "0.7"
rand = "0.10"
